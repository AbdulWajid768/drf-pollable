[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "drf-pollable"
version = "0.1.0"
description = "Auto-generate polling (status) APIs for Django REST Framework from a model field, instance, queryset, or function."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Abdul Wajid" }]
keywords = ["django", "django-rest-framework", "drf", "polling", "status", "api", "long-polling"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "Django>=4.2",
    "djangorestframework>=3.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-django>=4.7",
    "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/AbdulWajid768/drf-pollable"
Issues = "https://github.com/AbdulWajid768/drf-pollable/issues"
Changelog = "https://github.com/AbdulWajid768/drf-pollable/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["drf_pollable*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py39"
# Migrations are generated by Django; reformatting them adds churn and risk.
# README/GUIDE code blocks are illustrative prose -- ruff formats fenced Python
# inside Markdown, which rewrites hand-aligned examples. Leave the docs alone.
extend-exclude = ["*/migrations/*", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["DJ008"]
