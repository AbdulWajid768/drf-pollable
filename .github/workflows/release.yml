name: Release

# Trusted Publishing: PyPI mints a short-lived token from this workflow's OIDC
# identity, so no API token is stored in the repo or on anyone's laptop.
# Configure the publisher at https://pypi.org/manage/account/publishing/ with
# this exact workflow filename (release.yml) and environment (pypi).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check metadata renders on PyPI
        run: twine check --strict dist/*

      - name: Tag must match the version being published
        # A tag/version mismatch would publish a version nobody can trace back
        # to a commit, and PyPI version numbers cannot be reused once taken.
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "tag=$tag pyproject=$version"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag v$tag does not match pyproject version $version"
            exit 1
          fi

      - name: Tests must pass from the artifact being published
        # A tag push does not match the CI workflow's branch filter, so the
        # release gets its own run rather than trusting an earlier one.
        run: |
          mkdir -p /tmp/sdist && tar xzf dist/*.tar.gz -C /tmp/sdist --strip-components=1
          cd /tmp/sdist
          pip install Django djangorestframework pytest pytest-django
          pip install -e . --no-deps
          pytest -q

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/drf-pollable
    permissions:
      id-token: write # the OIDC token PyPI exchanges; nothing else is needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
