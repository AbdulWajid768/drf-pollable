name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    # Every (python, django) pair below is one the package actually claims to
    # support. Django's own Python support windows make this a hand-written
    # include list rather than a full cross product.
    name: py${{ matrix.python }} / Django ${{ matrix.django }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Dependency floor, exactly as advertised in pyproject.
          - python: "3.9"
            django: "4.2"
            drf: "3.14"
          - python: "3.10"
            django: "4.2"
          - python: "3.11"
            django: "4.2"
          - python: "3.12"
            django: "4.2"
          - python: "3.10"
            django: "5.0"
          - python: "3.11"
            django: "5.1"
          - python: "3.12"
            django: "5.2"
          - python: "3.13"
            django: "5.2"
          - python: "3.12"
            django: "6.0"
          - python: "3.13"
            django: "6.1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "Django~=${{ matrix.django }}.0"
          if [ -n "${{ matrix.drf }}" ]; then
            pip install "djangorestframework~=${{ matrix.drf }}.0"
          else
            pip install djangorestframework
          fi
          pip install pytest pytest-django
          pip install -e . --no-deps
      - name: Show resolved versions
        run: |
          python -c "import sys, django, rest_framework; print('py', sys.version.split()[0]); print('django', django.get_version()); print('drf', rest_framework.VERSION)"
      - name: Run tests
        run: pytest -q
      - name: Run the standalone runner advertised in the README
        run: python runtests.py

  package:
    # Guards the packaging itself: the sdist must contain a test tree that
    # actually runs, not just the test_*.py files setuptools picks up alone.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - name: Build sdist and wheel
        run: python -m build
      - name: Check metadata renders on PyPI
        run: twine check --strict dist/*
      - name: Tests must pass from the unpacked sdist
        run: |
          mkdir -p /tmp/sdist && tar xzf dist/*.tar.gz -C /tmp/sdist --strip-components=1
          cd /tmp/sdist
          pip install Django djangorestframework pytest pytest-django
          pip install -e . --no-deps
          pytest -q
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
